name: personal_assistant
description: 个人助理 App - 备忘录、AI 工具、运维工具集合
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # UI & 状态
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1          # 状态管理（推荐）
  go_router: ^14.2.0                # 路由

  # 网络 & 存储
  dio: ^5.4.3+1
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.2.2

  # 工具
  intl: ^0.19.0
  uuid: ^4.4.0
  path_provider: ^2.1.3

  # 扫码
  mobile_scanner: ^5.1.1            # 二维码/条形码

  # Excel 导出
  excel: ^4.0.3

  # 其他常用
  url_launcher: ^6.3.0
  connectivity_plus: ^6.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  # assets:
  #   - assets/images/
  #   - assets/icons/

  # fonts:
  #   - family: SFPro
  #     fonts:
  #       - asset: fonts/SF-Pro-Display-Regular.otf
